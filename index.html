<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отслеживание сигнала — Поиск…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    padding: 1.5rem;
    text-align: center;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* Левая часть — оранжево-чёрная */
  .bg-left {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: 50%;
    background:
      linear-gradient(135deg, rgba(249,115,22,0.28) 0%, rgba(234,88,12,0.12) 35%, rgba(0,0,0,0) 70%),
      radial-gradient(ellipse at 15% 85%, rgba(249,115,22,0.22) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(to right, rgba(249,115,22,0.08), rgba(0,0,0,0));
    pointer-events: none;
  }

  /* Правая часть — чёрно-серая */
  .bg-right {
    position: fixed;
    top: 0; bottom: 0; right: 0;
    width: 50%;
    background:
      linear-gradient(225deg, rgba(148,163,184,0.18) 0%, rgba(100,116,139,0.08) 40%, rgba(0,0,0,0) 70%),
      radial-gradient(ellipse at 85% 20%, rgba(156,163,175,0.14) 0%, rgba(0,0,0,0) 60%);
    pointer-events: none;
  }

  /* Разделительная линия по центру */
  .divider {
    position: fixed;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(249,115,22,0.45), rgba(148,163,184,0.35), rgba(0,0,0,0));
    pointer-events: none;
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(to right, #fb923c, #fed7aa, #cbd5e1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    z-index: 1;
  }

  /* ==== РАДАР: поиск сигнала ==== */
  .radar {
    position: relative;
    width: clamp(11rem, 30vw, 15rem);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(148,163,184,0.35);
    background: radial-gradient(circle, rgba(249,115,22,0.10) 0%, rgba(0,0,0,0.4) 70%);
    box-shadow: 0 0 40px rgba(249,115,22,0.15), inset 0 0 30px rgba(249,115,22,0.08);
    z-index: 1;
  }

  /* концентрические круги дальности */
  .radar::before,
  .radar::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(148,163,184,0.22);
    pointer-events: none;
  }
  .radar::before { inset: 22%; }
  .radar::after  { inset: 44%; }

  /* крест перекрестия */
  .crosshair-h, .crosshair-v {
    position: absolute;
    background: rgba(148,163,184,0.2);
    pointer-events: none;
  }
  .crosshair-h { left: 6%; right: 6%; top: 50%; height: 1px; }
  .crosshair-v { top: 6%; bottom: 6%; left: 50%; width: 1px; }

  /* вращающийся луч развёртки */
  .sweep {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(249,115,22,0.55) 0deg, rgba(249,115,22,0.18) 45deg, rgba(0,0,0,0) 90deg, rgba(0,0,0,0) 360deg);
    animation: spin 2.6s linear infinite;
    pointer-events: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* вспыхивающие точки-«цели» */
  .blip {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fb923c;
    box-shadow: 0 0 10px rgba(249,115,22,0.9);
    opacity: 0;
    animation: blip 2.6s ease-out infinite;
  }
  .blip.b1 { left: 30%; top: 36%; }
  .blip.b2 { left: 62%; top: 58%; animation-delay: 1.3s; }

  @keyframes blip {
    0%, 10% { opacity: 0; transform: scale(0.4); }
    16%     { opacity: 1; transform: scale(1.15); }
    45%     { opacity: 0.35; transform: scale(1); }
    100%    { opacity: 0; transform: scale(0.6); }
  }

  .radar-center {
    position: absolute;
    left: 50%; top: 50%;
    width: 10px; height: 10px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #f97316;
    box-shadow: 0 0 14px rgba(249,115,22,0.8);
    animation: centerPulse 1.6s ease-in-out infinite;
  }

  @keyframes centerPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(249,115,22,0.6); }
    50%      { box-shadow: 0 0 20px rgba(249,115,22,1); }
  }

  /* ==== Статус поиска ==== */
  .status {
    margin-top: 0.25rem;
    padding: 1rem 1.75rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(100,116,139,0.5);
    background: rgba(15,23,42,0.6);
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(69,26,3,0.3);
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    color: #cbd5e1;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    min-width: min(88vw, 26rem);
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  /* мигающий индикатор "идёт поиск" */
  .live-dot {
    width: 9px; height: 9px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #f97316;
    box-shadow: 0 0 8px rgba(249,115,22,0.9);
    animation: blink 1.1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }

  .searching {
    font-weight: 600;
    color: #fb923c;
  }
  .searching .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0%  { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100%{ content: ''; }
  }

  .activation { font-size: 0.92em; color: #94a3b8; }
  .activation b { color: #fb923c; font-weight: 600; }

  /* эквалizzer уровней приёма */
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
    margin-left: auto;
  }
  .bars span {
    width: 4px;
    background: linear-gradient(to top, #f97316, #fdba74);
    border-radius: 2px 2px 0 0;
    animation: eq 1s ease-in-out infinite;
  }
  .bars span:nth-child(1) { height: 30%; animation-delay: 0s;   }
  .bars span:nth-child(2) { height: 65%; animation-delay: .15s; }
  .bars span:nth-child(3) { height: 45%; animation-delay: .3s;  }
  .bars span:nth-child(4) { height: 85%; animation-delay: .45s; }
  .bars span:nth-child(5) { height: 55%; animation-delay: .6s;  }

  @keyframes eq {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  /* ==== Журнал сканирования ==== */
  .log {
    z-index: 1;
    width: min(88vw, 26rem);
    padding: 0.85rem 1.1rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(100,116,139,0.35);
    background: rgba(2,6,23,0.65);
    backdrop-filter: blur(6px);
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.78rem;
    color: #64748b;
    text-align: left;
    height: 7.2rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.65; }
  .log .fresh { color: #fdba74; }
  .log .time  { color: #475569; margin-right: 0.5em; }
</style>
</head>
<body>

<div class="bg-left"></div>
<div class="bg-right"></div>
<div class="divider"></div>

<h1>Отслеживание сигнала</h1>

<!-- Радиолокационный сканер -->
<div class="radar" aria-hidden="true">
  <div class="crosshair-h"></div>
  <div class="crosshair-v"></div>
  <div class="sweep"></div>
  <span class="blip b1"></span>
  <span class="blip b2"></span>
  <div class="radar-center"></div>
</div>

<!-- Статус -->
<div class="status">
  <div class="status-line">
    <span class="live-dot"></span>
    <span class="searching">Поиск сигнала<span class="dots"></span></span>
    <span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
  </div>
  <div class="status-line activation">
    Примерное время активации: <b>Не получается определить</b>
  </div>
</div>

<!-- Журнал сканирования -->
<div class="log" id="log" aria-live="polite"></div>

<script>
  const freqs = [
    'Сканирование диапазона 433.92 МГц…',
    'Сканирование диапазона 868.42 МГц…',
    'Сканирование диапазона 315.00 МГц…',
    'Опрос передатчиков GSM 900/1800…',
    'Сканирование диапазона 2.4 ГГц (BLE)…',
    'Сигнал не обнаружен — переход к следующему диапазону',
    'Калибровка приёмника… усиление 42 дБ',
    'Проверка шумового порога канала…',
    'Опрос спутниковых частот GNSS L1…',
    'Уровень шума: -97 дБм. Порог не превышен',
  ];

  const logEl = document.getElementById('log');
  let i = 0;

  function now() {
    return new Date().toLocaleTimeString('ru-RU', { hour12: false });
  }

  function addLine() {
    const line = document.createElement('div');
    line.innerHTML = '<span class="time">[' + now() + ']</span>' + freqs[i % freqs.length];
    logEl.appendChild(line);

    // подсвечиваем последнюю строку, приглушаем предыдущие
    const rows = logEl.querySelectorAll('div');
    rows.forEach(r => r.classList.remove('fresh'));
    line.classList.add('fresh');
    while (logEl.children.length > 4) logEl.removeChild(logEl.firstChild);

    i++;
  }

  addLine();
  setInterval(addLine, 1600);
</script>

</body>
</html>
